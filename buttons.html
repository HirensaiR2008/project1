<Style>
    .subscribe-button 
    {
        background-color: rgba(200, 0, 0);
        color:white;
        border:none;
        height:36px;
        width:105px;
        border-radius: 2px;
        cursor:pointer;
        margin-right:5px;
        transition:opacity 0.5s;

    }
    .subscribe-button:hover{
        opacity:0.5;
    }
    .subscribe-button:active{
        opacity:0.2;
    }
    .join-button{
        background-color: white;  
        border-color: rgba(41, 118, 211);
        border-style: solid;
        border-width:1px;
        color: rgb(41, 118, 211);
        height:36px;
        width:62px;
        cursor:pointer;
        margin-right:6px;
        transition:background-color 1s;
        color :1s;
    }
    .join-button:hover{
        background-color: rgb(41, 118, 211) ;
        color: white;
        opacity:0.8;
    }
    .join-button:active{
        opacity:0.2;
    }
    .tweet-button{
        background-color: rgb(0, 162, 255);
        color: white;
        height:36px;
        width:65px;
        border:none;
        border-radius:22px;
        cursor:pointer;
        font-weight:bold;
        font-size:15px;
        box-shadow:5px 5px 10px rgba(0 0 0 0.15);
        transition:box-shadow 0.15;
    }
    .tweet-button:hover{
        box-shadow:5px 5px 10px rgba(0 0 0 0.15);

    }
</Style>
<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>
