<!DOCTYPE html>
<html>
    <head>
        <title>YouTube Webpage</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Xmind:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style> 
        p{
            font-family:roboto,arial;
            margin-top:0px;
            margin-bottom:0px;
        }      
            .thumbnail{
                width:300px;
                display:block;
            }
            .searchbox{
                display:block;
            }
            .video-title{
                margin-top:0px;
                font-size:14px;
                font-weight:500px;
                line-height:20px;
                margin-bottom:12px;
            }
            .video-preview{
                width:300px;
                display:inline-block;
                vertical-align:top;
                margin-right:15px;
            }
            .channel-picture{
                display:inline-block;
                width:50px;
                vertical-align:top;
            }
            .video-info{
                display:inline-block;
                width:200px;
            }
            .profile-picture{
                width:40px;
                border-radius:50%;           
            }
            .thumbnail-row{
                margin-bottom:12px;
            }
            .video-author{
                font-size:12px;
                color:rgb(96,96,96);
                margin-bottom:4px;

            }
            .video-stats{
                font-size:12px;
                color:rgb(96,96,96);
            }

</style>        
    </head>
    <body>
        <input class="searchbox" type="text" placeholder="search">
        <div class="video-preview">
            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
            </div>
            <div>
                <div class="channel-picture">
                    <img class="profile-picture" src="thumbnails/channel-1.jpeg">
                </div>
                <div class="video-info">
                    <p class="video-title">talking tech and ai with google CEO sundhar pichai!</p>
        <p class="video-author">marques brownlee</p>
        <p class="video-stats">3.4M views &#183; 6 months ago</p>
                </div>
                
        
    </div>
            
</div>


<div class="video-preview">
            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-2.webp">
            </div>
            <div>
                <div class="channel-picture">
                    <img class="profile-picture" src="thumbnails/channel-2.jpeg">
                </div>
                <div class="video-info">
                    <p class="video-title">talking tech and ai with google CEO sundhar pichai!</p>
        <p class="video-author">markipilar</p>
        <p class="video-stats">19M views &#35; 4 years ago</p>
                </div>
                
        
    </div>
            
</div>


    </body>
</html>
